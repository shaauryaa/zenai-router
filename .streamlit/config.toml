[client]
# Students never see a stack trace; code/app.py shows a friendly message for every error it catches.
showErrorDetails = "none"
# Hide developer menu items (Deploy, rerun settings) from students.
toolbarMode = "viewer"

[browser]
# No usage statistics sent to Streamlit (also keeps the browser console clean when that request times out).
gatherUsageStats = false

[theme]
# Light mode only: base = "light" and no dark section, so a dark OS/browser setting still gets these colours.
base = "light"
# System font stack: native optical sizing and tracking on every platform.
font = "system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
headingFont = "system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
headingFontWeights = [700, 600, 600, 600, 600, 600]
headingFontSizes = ["2rem", "1.375rem", "1.125rem", "1rem", "0.9375rem", "0.875rem"]
baseFontSize = 16
baseRadius = "0.75rem"
buttonRadius = "0.75rem"
showWidgetBorder = true
linkUnderline = false

# White-first. Primary #0479A6 (buttons, links), brand sky #0593C6 lives in app.py CSS (fills, icons, focus).
# Status colours: green = quote verified, orange (amber) = draft only, red = safety. Pink is never a status.
primaryColor = "#0479A6"
backgroundColor = "#FCFFFF"
secondaryBackgroundColor = "#F2F7FA"
textColor = "#14212B"
borderColor = "#E6EDF2"
linkColor = "#0479A6"
codeBackgroundColor = "#F5F9FB"
codeTextColor = "#14212B"
greenColor = "#15803D"
greenTextColor = "#14632F"
greenBackgroundColor = "#E9F7EE"
orangeColor = "#B45309"
orangeTextColor = "#8A3B06"
orangeBackgroundColor = "#FDF3E4"
redColor = "#B42318"
redTextColor = "#9B1C13"
redBackgroundColor = "#FDEEEC"
blueColor = "#0479A6"
blueTextColor = "#035F82"
blueBackgroundColor = "#E8F5FB"

[theme.sidebar]
backgroundColor = "#F6FAFC"
secondaryBackgroundColor = "#EAF2F6"
borderColor = "#E6EDF2"
textColor = "#14212B"
